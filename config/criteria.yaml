criteria:
- name: theory_of_impact
  description: "If the named party acts on this idea, does catastrophic risk from advanced AI go down? Scores the risk link only. Whether anyone will act is scored separately by impact_pathway."
  default_weight: 0.75
  refinement_threshold: 4
  rubric:
    - score: 1
      label: Not catastrophic
      description: No catastrophic scenario named. The harm addressed is ordinary and recoverable (bias, mundane misuse, a near-term safety incident) with no credible route from there to reducing catastrophic risk
    - score: 2
      label: Generic label
      description: A catastrophic scenario is named only as a label ("existential risk", "loss of control", "misalignment") with no mechanism. Nothing explains how the catastrophe would actually come about
    - score: 3
      label: Partial
      description: A specific mechanism is named (e.g. "deceptive alignment surviving training", "undetected sabotage in an agent pipeline", "reward hacking that generalises to deployment"), but the action the idea leads to addresses that mechanism only partially or indirectly
    - score: 4
      label: Direct
      description: A specific mechanism is named, and the action directly reduces that mechanism's contribution to the catastrophe. The reduction is in the mechanism itself, not in a correlate of it
    - score: 5
      label: Necessary step
      description: "As score 4, and the mechanism is a step the catastrophic pathway *requires*, so constraining it constrains the whole pathway rather than one contributing factor among several. Whether the risk is widely recognised is irrelevant: a mechanism nobody has studied scores 5 if the necessity argument holds on its own terms. Never award or withhold this level based on whether established safety agendas agree the pathway is critical"
- name: impact_pathway
  description: "How close is the change this idea calls for to actually happening? Scores whether anyone will act, not whether acting would help (that is theory_of_impact). The idea must declare one pathway: A decision, B research redirection, C prerequisite, D field epistemics, E talent allocation."
  default_weight: 0.75
  refinement_threshold: 4
  rubric:
    - score: 1
      label: No pathway
      description: No pathway or endpoint declared. Value is stated only as "advances understanding", "informs the community", or similar
    - score: 2
      label: Generic endpoint
      description: "A pathway is declared, but the endpoint dissolves into a category rather than a change. Characteristic phrasing: 'helps future evaluators know what to look for', 'would improve the credibility of safety comparisons', 'this database would be a public good', 'strengthens the case for standardised metrics'. Plausible-sounding, but no party is named and nothing they do would differ"
    - score: 3
      label: Blocked
      description: The endpoint is specific, but making it happen needs something nobody currently has — a new regulatory mandate, industry-wide coordination, a change in how frontier models are trained, or funding no one has committed
    - score: 4
      label: Within reach
      description: The endpoint is specific and within reach of the named party, but still costs them real effort or a shift in priorities
    - score: 5
      label: Ready to adopt
      description: "The endpoint is specific AND either (i) it is cheap for the named party to adopt, slotting into what they already do with resources they already control (e.g. improving a metric a lab already reports in its system cards), OR (ii) it is a larger ask matched by a named party who has both the authority and the incentive to make it happen (e.g. a regulator or standards body that could require it). Never require evidence of pre-existing demand such as an RFP or a published open problem: a neglected direction has neither by definition"
- name: low_compute
  description: Can this idea be explored with limited compute resources?
  default_weight: 1.5
  refinement_threshold: 0
  rubric:
    - score: 1
      label: Infeasible
      description: Requires large-scale training runs, hundreds of GPU-hours, or access to frontier model weights
    - score: 2
      label: Heavy
      description: Requires multiple A100-days or significant cloud budget; possible but expensive for a small team
    - score: 3
      label: Moderate
      description: Feasible with a single mid-range GPU over days, or moderate API costs; requires some resource planning
    - score: 4
      label: Light
      description: Runs on a single consumer GPU or modest API budget; can iterate quickly
    - score: 5
      label: Minimal
      description: Can be done with CPU-only, free-tier APIs, or purely analytical/theoretical work
- name: accessible_complexity
  description: "Is the technical complexity a good fit for THIS team? Score relative to the skills, time budget and supervision described in the participant profile supplied with this batch — never against an absolute skill bar, and never against what a beginner could do. The same idea should score differently for a beginner team and an experienced one; that is the point of this criterion. If no participant profile is supplied, assume a small team with solid Python and ML fundamentals, no specialist depth, and no supervisor."
  default_weight: 1.5
  refinement_threshold: 4
  rubric:
    - score: 1
      label: Out of reach
      description: "Requires expertise nobody on the team has, and that no supervisor named in the profile could supply, with no simplification path and no realistic route to acquiring it inside the stated time budget. The team would not finish"
    - score: 2
      label: Ramp-up dominates
      description: "Within reach only by spending most of the time budget learning the method, tooling or subfield, leaving too little for the research itself. A result is possible but the project is mostly self-education"
    - score: 3
      label: Stretch
      description: "Requires a genuinely new skill or unfamiliar tooling for this team. Acquirable inside the time budget, with supervision where the profile provides it, but the ramp-up is a real schedule risk and could cost the project its first result"
    - score: 4
      label: Good fit
      description: "Builds on skills the team already has. Any new method can be picked up from a paper with the level of support the profile describes, and ramp-up is a small fraction of the time budget"
    - score: 5
      label: Immediate
      description: "Squarely within the team's existing skills and tooling as described in the profile. They can start producing results in the first weeks with no meaningful ramp-up"
- name: narrow_scope
  description: Does the idea have a self-contained first deliverable that is valuable on its own, with a clear methodology and success criteria?
  default_weight: 1.5
  refinement_threshold: 5
  rubric:
    - score: 1
      label: Open-ended program
      description: An entire research agenda or open-ended question with no clear stopping point and no identifiable first deliverable; all-or-nothing
    - score: 2
      label: No clear first milestone
      description: Multiple loosely connected sub-questions or a large design space; a deliverable might exist but depends on resolving many unknowns first
    - score: 3
      label: Deliverable requires sustained effort
      description: A concrete first deliverable exists but requires multiple workstreams or experimental dimensions to reach; the path from start to first result is long
    - score: 4
      label: Focused first deliverable
      description: A specific, well-bounded first deliverable with clear methodology and few dependencies; the broader research direction may be ambitious but the first milestone stands on its own
    - score: 5
      label: Tightly scoped
      description: A single, precise experiment with well-defined success criteria and an obvious deliverable (e.g., one replication, one benchmark, one ablation study); can go from start to meaningful result quickly
- name: counterfactual_value
  description: "Does pursuing this idea *outside* a major AI safety lab add counterfactual value? High = neglected by and ill-suited to frontier labs (long-horizon, low lab incentive, no internal access needed); low = something labs will do better, are strongly incentivized to do, or that needs internal access (weights, defense-in-depth, proprietary data) to do well or to generalize."
  default_weight: 1.5
  refinement_threshold: 4
  rubric:
    - score: 1
      label: Lab territory
      description: Clearly belongs to a major lab. Strongly matches a "leave to labs" factor — a major org is already actively working on it (they will do it better), OR it fundamentally needs internal access (frontier model weights, internal defense-in-depth details, proprietary infra/data) to do well or for results to generalize, OR frontier labs have a strong standing incentive (commercial, competitive, or safety-critical to their own deployment) to solve it themselves. An independent team outside a major lab adds little counterfactual value
    - score: 2
      label: Mostly lab-suited
      description: Substantially overlaps an active frontier-lab agenda, or leans heavily on internal access to be done well. Labs are clearly better positioned and likely to cover it; an independent team could contribute only at the margins
    - score: 3
      label: Mixed
      description: Partly within frontier-lab interest or partly dependent on internal context, but a meaningful externally-doable slice remains. Counterfactual value for an independent team is moderate or uncertain
    - score: 4
      label: Independent-friendly
      description: Little active lab coverage and weak lab incentive to pursue it; doable with public models/data and the results generalize without internal access. An independent team has a clear comparative advantage
    - score: 5
      label: Neglected long-horizon
      description: "The 'gold' case — a foundational or long-horizon problem frontier labs have little incentive to attack now (not commercially pressing, not on published near-term agendas), needs no internal access, generalizes from public artifacts, and benefits from independent or external work (e.g., third-party scrutiny, auditing, replication). High counterfactual value for an independent team"
- name: novelty
  description: "Derived criterion: how novel is this idea relative to published work? Score is derived from evidence-based novelty assessment (KB + web search), not direct rubric evaluation. 'Already solved' (score 1) is a hard gate that kills the idea regardless of other scores."
  default_weight: 1.0
  refinement_threshold: 4
  rubric:
    - score: 1
      label: Already solved
      description: "HARD GATE — existing published work fully addresses this idea; the proposed research would not produce new knowledge. Evidence: specific paper(s) that solve the problem"
    - score: 2
      label: Largely addressed
      description: Multiple published works cover most of the proposed contribution; remaining gaps are minor or incremental
    - score: 3
      label: Partially addressed
      description: Published work exists on the topic but the specific angle, method, or combination proposed has not been explored; the idea extends existing work in a meaningful direction
    - score: 4
      label: Mostly novel
      description: No direct published work on this specific proposal; related work exists in adjacent areas but the core contribution is new
    - score: 5
      label: Novel
      description: No published work found addressing this question or approach; the idea opens a genuinely new direction or combination not present in the literature
