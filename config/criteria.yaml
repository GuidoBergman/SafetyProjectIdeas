# Scoring Criteria for Idea Evaluation
# Five default criteria with per-team-type weight overrides.

criteria:
  - name: soundness
    description: "Is the research idea scientifically sound and well-motivated?"
    default_weight: 2.0
    team_type_overrides:
      mentor_novice: 2.0
      solo_novice: 2.0
      experienced_group: 2.0

  - name: relevance
    description: "How relevant is this idea to current AI Safety research priorities?"
    default_weight: 2.0
    team_type_overrides:
      mentor_novice: 2.0
      solo_novice: 2.0
      experienced_group: 2.0

  - name: theory_of_impact
    description: "Does this idea have a clear theory of how it advances AI Safety?"
    default_weight: 1.5
    team_type_overrides:
      mentor_novice: 1.0
      solo_novice: 0.5
      experienced_group: 3.0

  - name: low_compute
    description: "Can this idea be explored with limited compute resources?"
    default_weight: 1.5
    team_type_overrides:
      mentor_novice: 2.0
      solo_novice: 2.5
      experienced_group: 0.0

  - name: accessible_complexity
    description: "Is the technical complexity appropriate for the team's skill level?"
    default_weight: 1.5
    team_type_overrides:
      mentor_novice: 2.0
      solo_novice: 2.5
      experienced_group: 0.5
