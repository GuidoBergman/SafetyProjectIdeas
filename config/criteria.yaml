criteria:
- name: theory_of_impact
  description: Does this idea have a clear, specific theory of how it advances AI Safety?
  default_weight: 1.5
  rubric:
    - score: 1
      label: No impact chain
      description: No articulated connection between the research and any safety outcome
    - score: 2
      label: Vague impact
      description: Claims safety relevance but the causal chain is hand-wavy or generic ("helps with alignment")
    - score: 3
      label: Plausible chain
      description: Identifies a specific safety problem and a reasonable mechanism by which the research addresses it, but some links are speculative
    - score: 4
      label: Strong chain
      description: Clear, specific impact chain ("This research leads to X, which reduces risk Y, because Z") with each link grounded in existing evidence or well-reasoned argument
    - score: 5
      label: Compelling chain
      description: Impact chain is specific, grounded, and addresses a problem recognized as critical; intermediate deliverables also have clear safety value
- name: low_compute
  description: Can this idea be explored with limited compute resources?
  default_weight: 1.5
  rubric:
    - score: 1
      label: Infeasible
      description: Requires large-scale training runs, hundreds of GPU-hours, or access to frontier model weights
    - score: 2
      label: Heavy
      description: Requires multiple A100-days or significant cloud budget; possible but expensive for a small team
    - score: 3
      label: Moderate
      description: Feasible with a single mid-range GPU over days, or moderate API costs; requires some resource planning
    - score: 4
      label: Light
      description: Runs on a single consumer GPU or modest API budget; can iterate quickly
    - score: 5
      label: Minimal
      description: Can be done with CPU-only, free-tier APIs, or purely analytical/theoretical work
- name: accessible_complexity
  description: Is the technical complexity appropriate for the team's skill level?
  default_weight: 1.5
  rubric:
    - score: 1
      label: Expert-only
      description: Requires deep specialist knowledge (e.g., novel architecture design, advanced math, systems-level ML engineering) with no clear simplification path
    - score: 2
      label: Advanced
      description: Requires strong ML/research background and familiarity with specific subfield literature; a motivated grad student could attempt it with significant ramp-up
    - score: 3
      label: Intermediate
      description: Requires solid ML fundamentals and comfort with existing frameworks/tools; methodology is well-established but application is novel
    - score: 4
      label: Guided
      description: Clear methodology inherited from existing work (e.g., replication with variation); a novice with mentor guidance can execute it
    - score: 5
      label: Accessible
      description: Well-defined steps using standard tools and public datasets; a motivated beginner with basic Python/ML can make meaningful progress
