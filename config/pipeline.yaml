# Pipeline Settings
# Model assignments per stage and threshold settings per filter stage.

model_assignments:
  source:
    model: haiku
    fallback: ""
  generate:
    model: sonnet
    fallback: haiku
  filter_score:
    model: sonnet
    fallback: haiku
  refine:
    model: opus
    fallback: sonnet
  rank:
    model: sonnet
    fallback: haiku

thresholds:
  filter_score:
    min_score: 5.0
    max_ideas: 20
  rank:
    min_score: 6.0
    max_ideas: 10
