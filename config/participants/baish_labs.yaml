name: baish_labs
background: >-
  A BAISH Labs research team: 2-3 early-career researchers working part-time
  for 6 months, supervised by a project lead. Typically students or recent
  graduates in CS, ML or a quantitative field. Every member has already
  published at least one AI safety project of their own (a paper, a public
  research report or a substantial write-up), so this is not anyone's first
  contact with the field or with shipping research. They are not yet fully
  independent researchers, so the project lead sets direction, reviews progress
  and unblocks them, but does not do the hands-on work.
technical_skills: >-
  Solid Python and general ML engineering. Comfortable with PyTorch and the
  Hugging Face ecosystem, running and fine-tuning open-weight models, building
  evaluation harnesses, and analysing results. Familiar with the AI safety
  literature: they can situate a new result against existing work, know the
  major agendas and can read a current paper in a subfield such as
  interpretability, evaluations or oversight without a primer. Depth in any one
  subfield is still limited. Each has taken a project through to publication
  before, so assume they can pick up a new method from a paper and run it, and
  that supervision is about sharpening experimental design and framing rather
  than teaching the basics.
compute_resources: >-
  High — access to a multi-GPU cluster. Multi-day multi-GPU training runs,
  fine-tuning of mid-size open-weight models, and small-scale pretraining are
  all in scope, alongside a substantial LLM API budget. Compute is not the
  binding constraint; researcher time is. Frontier model weights are still out
  of reach, so anything requiring internal access at a major lab is not
  feasible.
total_hours: 1300
time_context: >-
  6 calendar months at part-time intensity. The budget above is TEAM
  person-hours, computed as 20 hours per week per researcher across about
  26 weeks with 2-3 researchers (2.5 on average). The project must fit
  inside that envelope end to end, including literature review, implementation,
  experiments, analysis and writing. Because the work is part-time and spread
  over 6 months, favour projects that reach a first meaningful result within
  the first 2 months and then deepen it, over projects where everything depends
  on a single result arriving late.
deliverables: >-
  A paper-quality writeup of the findings, suitable for submission to a
  workshop or for publication as a public research report, plus a public code
  repository that reproduces the main results. Intermediate deliverables along
  the way are expected, so the project should have a first self-contained
  milestone that is valuable on its own even if later stages are cut.
goals: >-
  Produce a genuine research contribution that stands up to outside scrutiny,
  and build the researchers into people who can run their own projects
  afterwards. Priority is work that is valuable to do outside a major AI safety
  lab: neglected directions, third-party scrutiny, replication and auditing,
  and long-horizon problems the frontier labs have little near-term incentive
  to attack.
