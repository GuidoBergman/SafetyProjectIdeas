name: hackathon_team
background: >-
  A small, mostly-remote team formed for a weekend AI safety hackathon.
  Typically 2-4 people, about 3 on average. Mostly students and early-career
  technical people (CS, ML, software engineering). Most are first-time Apart
  hackathon participants with basic-to-intermediate AI safety exposure:
  coursework or reading, or a few small projects, rather than published
  research. Motivated and capable, but new to research and strongly time-boxed.
technical_skills: >-
  Comfortable programming, mostly in Python. Working familiarity with ML and
  with using pretrained models through libraries and APIs (e.g., Hugging Face,
  OpenAI/Anthropic). Can prompt and evaluate LLMs, fine-tune small models, and
  run modest experiments. Limited hands-on experience with interpretability,
  RLHF, evals frameworks, or large-scale training. Assume they cannot train
  large models from scratch or stand up complex infrastructure in the time
  available.
compute_resources: >-
  Low-to-medium. Free or low-cost cloud (Colab free/Pro, Kaggle), a personal
  laptop or single consumer GPU, and LLM API access (budget-limited accounts).
  No multi-GPU clusters and no long training runs; single-GPU jobs of at most a
  few hours.
total_hours: 40
time_context: >-
  A weekend research sprint: about 48 hours of wall-clock from kickoff to the
  submission deadline (typically Friday evening to Sunday), which leaves
  roughly 35-45 hours of focused team work once sleep, setup and onboarding are
  removed. The whole project must be completable within that window,
  including implementation, experiments, analysis, and writing up the submission.
deliverables: >-
  A project submitted by the deadline: a short written report or blog post as
  the main artifact, plus supporting code (a public repo or notebook) and often
  a slide deck or recorded presentation. Findings must be communicated clearly
  and tied explicitly to why they matter for AI safety.
goals: >-
  Produce a concrete, communicable, safety-relevant result by the end.
  Learn by doing, build a portfolio piece, meet collaborators, and explore or
  advance an AI safety career. A bonus if the work can be extended
  afterward (for example into a longer program like Apart Lab).
