# BAISH Team Profiles
# Three team types reflecting actual BAISH team configurations.

teams:
  - name: "Mentor-Novice Pair"
    team_type: mentor_novice
    compute_budget: low
    technical_skills:
      - python_basics
      - ml_fundamentals
    criteria_weights:
      low_compute: 2.0
      accessible_complexity: 2.0
      theory_of_impact: 1.0

  - name: "Solo Novice Researcher"
    team_type: solo_novice
    compute_budget: low
    technical_skills:
      - python_basics
    criteria_weights:
      low_compute: 2.5
      accessible_complexity: 2.5
      theory_of_impact: 0.5

  - name: "Experienced Research Group"
    team_type: experienced_group
    compute_budget: high
    technical_skills:
      - python_advanced
      - ml_advanced
      - deep_learning
      - interpretability
    criteria_weights:
      low_compute: 0.0
      accessible_complexity: 0.5
      theory_of_impact: 2.0
