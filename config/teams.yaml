default_team: baish_labs
default_participant: baish_labs
teams:
- name: Experienced Research Group
  team_type: experienced_group
  technical_skills:
  - python_advanced
  - ml_advanced
  - deep_learning
  - interpretability
  criteria_weights:
    low_compute: 0.0
    accessible_complexity: 0.5
    theory_of_impact: 1.0
    impact_pathway: 1.0
    counterfactual_value: 2.0
    narrow_scope: 1.0
    novelty: 2.0
- name: Solo Novice Researcher
  team_type: solo_novice
  technical_skills:
  - python_basics
  - cs_fundamentals
  - ml_fundamentals
  criteria_weights:
    low_compute: 0.0
    accessible_complexity: 3.0
    theory_of_impact: 0.75
    impact_pathway: 0.75
    counterfactual_value: 1.5
    narrow_scope: 2.5
    novelty: 0.5
- name: Mentor-Novice Pair
  team_type: mentor_novice
  technical_skills:
  - python_basics
  - cs_fundamentals
  - ml_fundamentals
  criteria_weights:
    low_compute: 0.0
    accessible_complexity: 3.5
    theory_of_impact: 1.5
    impact_pathway: 1.5
    counterfactual_value: 3.0
    narrow_scope: 5.0
    novelty: 2.5
- name: BAISH Labs Team
  team_type: baish_labs
  technical_skills:
  - python_advanced
  - ml_advanced
  - deep_learning
  criteria_weights:
    # Three essential dimensions, equally weighted at 1.0 each.
    # "Feasibility" is not a single criterion — it is the cluster of
    # low_compute + accessible_complexity + narrow_scope, whose weights
    # sum to 1.0 so the cluster counts the same as novelty and impact.
    # "Impact" is likewise a cluster of two: theory_of_impact (does acting
    # reduce catastrophic risk?) + impact_pathway (will anyone act?), split
    # 0.5/0.5 so the pair together counts as one dimension.
    novelty: 1.0
    theory_of_impact: 0.5
    impact_pathway: 0.5
    # low_compute is 0: the team has cluster access, and that rubric scores
    # cheapness (top score = "CPU-only or purely analytical"), so it would
    # penalise exactly the work the cluster exists for. The one signal worth
    # keeping from it, "needs frontier model weights", is already covered by
    # counterfactual_value score 1.
    low_compute: 0.0
    accessible_complexity: 0.5
    narrow_scope: 0.5
    # Not one of the three headline dimensions, but BAISH Labs sits outside
    # the frontier labs, so half weight keeps the pipeline steering away from
    # work those labs will do better and sooner.
    counterfactual_value: 0.5
