# Workflow Status Template

# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2026-02-12"
project: "OpenProblemList"
project_type: "AI Safety research resource - open problems list and project ideas"
selected_track: "method"
field_type: "greenfield"
workflow_path: "method-greenfield"

workflow_status:
  # Phase 0 - Discovery (Optional)
  - phase: 0
    name: "Discovery (Optional)"
    workflows:
      - id: "brainstorm-project"
        status: "docs/analysis/brainstorming-session-2026-02-12.md"
        agent: "analyst"
        command: "/brainstorming-session"

      - id: "research"
        status: "docs/analysis/research/domain-ai-safety-open-problems-research-2026-03-02.md"
        agent: "analyst"
        command: "/research"

      - id: "product-brief"
        status: "optional"
        agent: "analyst"
        command: "/create-product-brief"

  # Phase 1 - Planning
  - phase: 1
    name: "Planning"
    workflows:
      - id: "prd"
        status: "required"
        agent: "pm"
        command: "/create-prd"

      - id: "create-ux-design"
        status: "conditional: if_has_ui"
        agent: "ux-designer"
