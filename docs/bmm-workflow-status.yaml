  # Phase 2 - Solutioning
  - phase: 2
    name: "Solutioning"
    workflows:
      - id: "create-architecture"
        status: "docs/architecture.md"
        agent: "architect"
        command: "/create-architecture"

      - id: "create-epics-and-stories"
        status: "required"
        agent: "pm"
        command: "/create-epics-stories"

      - id: "test-design"
        status: "recommended"
        agent: "tea"
        command: "/testarch-test-design"

      - id: "validate-architecture"
        status: "optional"
        agent: "architect"
        command: "/check-implementation-readiness"

      - id: "implementation-readiness"
        status: "required"
        agent: "architect"
        command: "/check-implementation-readiness"

  # Phase 3 - Implementation
  - phase: 3
    name: "Implementation"
    workflows:
      - id: "sprint-planning"
        status: "required"
        agent: "sm"
        command: "/sprint-planning"
