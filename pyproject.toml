[project]
name = "saim"
version = "0.1.0"
description = "AI Safety Research Idea Generation Pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "arxiv>=2.1",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embeds a large HTML/CSS/JS template as a raw string; long lines are unavoidable.
"scripts/build_proposals_browser.py" = ["E501"]
"scripts/build_idea_dashboard.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
